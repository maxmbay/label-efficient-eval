[project]
name = "lee"
version = "0.1.0"
description = "Label-efficient evaluation: PPI/CUPED-style estimates from LLM judges and small human samples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "datasets",
  "ppi-python",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
jax = ["jax", "equinox", "numpyro"]
modal = ["modal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: hits the network or on-disk ToxicChat cache",
]
